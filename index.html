<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 标签页 favicon 用一张独立的照片（避免与正文头像视觉重复） -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ruiqi Yu · 虞瑞麒 — 个人博客" />
    <title>Ruiqi Yu · 虞瑞麒</title>
    <!--
      Pre-paint 主题脚本：在 React 挂载前就给 <html> 加上 .dark 类，
      避免首次加载时先闪一下浅色再切深色（FOUC）。
      逻辑必须与 src/hooks/useTheme.ts 的初始化保持一致：
        localStorage 有值就用 localStorage，否则默认深色。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
