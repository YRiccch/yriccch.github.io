<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 个人线条头像 favicon，深色底确保在浅色和深色标签页中都清晰 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ruiqi Yu · 虞瑞麒 — 个人博客" />
    <title>Ruiqi Yu · 虞瑞麒</title>
    <!--
      Pre-paint 主题脚本：在 React 挂载前就给 <html> 加上 .dark 类，
      避免首次加载时先闪一下浅色再切深色（FOUC）。
      逻辑必须与 src/hooks/useTheme.ts 的初始化保持一致：
        localStorage 有值就用 localStorage，否则默认深色。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      GoatCounter 隐私友好统计（无 Cookie、不存原始 IP，面板仅自己登录可见）。
      面板：https://yriccch.goatcounter.com（站点代码 yriccch）。
      no_onload：关闭默认的"加载即上报"，因为本站是 hash 路由 SPA，
      改由 src/hooks/useGoatcounter.ts 监听路由变化手动上报（否则切页不计数）。
    -->
    <script
      data-goatcounter="https://yriccch.goatcounter.com/count"
      data-goatcounter-settings='{"no_onload": true}'
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
